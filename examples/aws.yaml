# The AWS identities a deployment reads its **secrets** with: `config/aws.yaml`.
#
# A secret reference names *what* to read; an identity is *who reads it*. Each name
# below becomes a scheme of its own — `live:` here means `aws-ssm-live://…` and
# `aws-sm-live://…` are resolvable — so a reference in a check config stays a name
# for a secret and never carries a credential, a region or a role
# (docs/adr/0002-aws-secret-references.md).
#
# The identity is in the **scheme** rather than in the address because no separator
# survives both stores: a cross-account Secrets Manager id is an **ARN** and carries
# `:`, while Parameter Store takes a bare name and refuses an ARN outright.
#
# **This file is not the `aws` check's configuration.** Which accounts are *watched*
# is a check config (examples/checks/aws.yaml), one `accounts:` entry each. What is
# here is how a process authenticates to *read a secret at startup* — a different
# question with a different lifetime, since a secret resolves once, before any
# check exists.
#
# Nothing here is required. With no identity declared — or no file at all — the plain
# `aws-sm://` and `aws-ssm://` schemes read through the ambient credential chain
# (`AWS_PROFILE`, an SSO session, an instance profile), which is what a deployment
# did before identities existed.
#
# Every key is optional except that an identity must name **something** — a
# `profile:`, a `role_arn:`, a `region:`, or any combination of the three (a profile
# and a role together, where the role is assumed *from* the profile). An entry that
# names none of them is refused: with nothing of its own to say it really is the plain
# scheme wearing a name, and it is far more often a block somebody meant to fill in.
# An unknown key, a key written and left empty, or a name that could not be a scheme —
# anything but lower-case letters, digits and hyphens, starting with a letter —
# refuses the start rather than quietly reading a credential from somewhere else.
#
# Every value below is a placeholder. This file is the *shape* — every key, with a
# comment saying what it decides — not anybody's configuration.

live:
  # An ~/.aws/config profile the session starts from. Composes with `role_arn`:
  # the profile says from where, the role says into what.
  profile: primary-admin
  # The role to assume, from that profile or from the ambient chain — this is
  # what reaches another account.
  role_arn: arn:aws:iam::000000000000:role/monitoring-role
  # Where the *store* is; a Parameter Store name in another region is a different
  # parameter. Default: whatever the profile or the environment implies.
  region: eu-central-1
  # Where the AssumeRole call itself is made (default: eu-central-1).
  # sts_region: eu-central-1
  # What CloudTrail shows beside the reads (default: little-sister).
  # role_session_name: little-sister
  # Whether this identity may renew its own expired SSO login while the
  # application starts, and what that may cost the boot:
  #   login:   auto (default) asks the machine first — is this an SSO profile,
  #            is the CLI here, is there a browser nobody would see; always
  #            skips that question; never only prints the command it would run
  #   timeout: how long the login may hold the **boot** (default 45s — a
  #            check's own budget is 120s, but nothing is booting behind a
  #            check). There is no cooldown key: a startup reads its secrets
  #            once, and one attempt per profile per process is built in.
  # sso:
  #   login: auto
  #   timeout: 45s

backup:
  # A second account: its own role, read through the same profile's login —
  # two identities behind one profile still open at most one browser.
  profile: primary-admin
  role_arn: arn:aws:iam::000000000001:role/monitoring-role
  region: eu-west-1

cloud:
  # An identity may name **only** the region its store is in, and that is the shape a
  # server wants: read *this* store, in *this* region, as whatever this host is
  # already authorized as — an instance role, a task role, keys in the environment.
  # There is nothing to assume and no profile to name, so there is nothing to write.
  #
  # It is not the plain schemes wearing a name, and the region is the whole
  # difference: those read the store the host's environment implies, and this one says
  # which store to read whatever the environment implies. So it is what lets a
  # deployment that runs on a laptop and in a cloud account commit **one** set of
  # references for both — the same `aws-ssm-cloud://…` in every check config, with
  # only this file differing: a `profile:` here on the laptop, this entry on the
  # instance whose own role is already exactly right.
  region: eu-central-1
