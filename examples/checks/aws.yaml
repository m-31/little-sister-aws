# The `aws` check: one node per aspect, beneath one node per account where the check
# names several.
#
#   /team/aws
#     /team/aws/live
#       /team/aws/live/cloudwatch
#       /team/aws/live/ec2
#       /team/aws/live/lambda
#         /team/aws/live/lambda/<function>     a node for every function
#       /team/aws/live/codepipeline
#         /team/aws/live/codepipeline/<pipeline>     and for every pipeline
#       /team/aws/live/batch
#         /team/aws/live/batch/<queue>               for every job queue
#           /team/aws/live/batch/<queue>/<job name>  and every job name in it
#     /team/aws/backup
#       …
#
# Account first because the account is what you act on as a group: one maintenance
# pin on /team/aws/live silences a migration, where the same thing on a flat list of
# alarms would be one pin per alarm.
#
# A level stands only where the configuration names several of it. This file names
# two accounts, so each has a node. A check that names ONE account has no account
# level: its aspects hang beneath the check's own node — /team/aws/ec2 — and a
# function, a pipeline and a job queue hang beneath their region's node,
# /team/aws/…/lambda/eu-west-1/<function>, only where their account reads several
# regions. A job queue is the one level AWS names, and it stands in every tree. The
# day a file names a second account, or an account a second region, every path
# beneath the new level moves, and a pin or a `nodes.yaml` entry keyed by an old path
# does not follow.
#
# Every value below is a placeholder. This file is the *shape* — every key the type
# accepts, with a comment saying what it decides — not anybody's configuration.
type: aws
path: /team/aws
title: AWS
about: |
  The team's AWS accounts, one node each.
frequency: 60s
# No bound in this type: a run takes as long as AWS takes to answer, and one that
# outgrows `frequency:` is reported late on /little-sister/engine. Longer than
# `frequency:`, as here, the key is a warning in the log when the check is loaded and
# a sentence in that node's report: the check may run late.
timeout: 120s
# How many readings of each history to keep, the oldest out. This check keeps four:
# each Batch job name's runs, one record per run, in its final state once it has
# finished; each pipeline's executions, one record per execution; each Lambda
# function's runs, one record per minute it was invoked in; and the accounts' own, one
# record each time an account opens or stops opening. Alarms, instances and queues
# keep none. A job name's, a pipeline's and a function's history is drawn on the node
# of the job name, the pipeline or the function, each run marked by how it stood — and
# on this check's own node for one that has no node at the moment. A history is keyed
# by the account's `name` below, so renaming an account starts its histories again, and
# adding or removing an account starts the accounts' own again.
# Every function adds a history, some 340 bytes a kept run against little-sister's
# `series_limit` (`settings.yaml`, 8 MiB by default): about 10 KB a function at 30.
# The default, 0, keeps nothing — and asks CloudWatch nothing of a function's runs.
# series_keep: 30
#
# Which numbers of a kept record are drawn. The type declares three: `duration_ms`, a
# function's run's slowest invocation, in ms; `duration_s`, how long a Batch run ran
# and how long a pipeline's execution took; and `wait_s`, how long a Batch run waited
# before it started, both in s. Name a field to take it whole, write `null` to take a
# plot away, and add a count where you want one drawn.
# measures:
#   duration_ms: null
#   wait_s: null
#   invocations: calls

# --- Credentials -------------------------------------------------------------
# With no `secrets:` block the ambient AWS credential chain is used — an instance
# profile, a task role, an SSO session, or the AWS_* variables — and each account's
# role is assumed from it. That is the normal path on a server.
#
# secrets:                       # only for static keys; see below
#   access_key_id: env://AWS_ACCESS_KEY_ID
#   secret_access_key: env://AWS_SECRET_ACCESS_KEY
#
# `profile` names the ~/.aws/config profile the roles are assumed **from**: it says
# from where and `role_arn` says into what, and the two compose. Unset, nothing
# moves — boto3 reads the ambient chain, AWS_PROFILE included. It is **mutually
# exclusive with a `secrets:` block**, because a profile carries its own credentials
# and a config naming both has said two things about which estate it watches.
#
# profile: my-sso-profile

# --- Renewing an expired SSO login -------------------------------------------
# An SSO login expires about once a working day. Inside that window botocore
# refreshes the role credentials by itself; outside it the fix is a human at a
# browser — a command this process can run, but only on a machine where that
# browser exists. `auto` works that out and says on the card what it decided: it
# declines on a server, in a container, without the `aws` CLI, on platform-supplied
# credentials, and where no profile is configured.
#
# sso:
#   login: auto      # auto (default) | always (skip the question) | never
#   timeout: 2m      # one login is stopped after this — it holds a worker thread
#   cooldown: 10m    # and not retried for this long, per profile, process-wide

# --- Defaults every account inherits -----------------------------------------
regions: [eu-central-1]
# role_session_name: little-sister   # the default; it is what CloudTrail shows
# sts_region: eu-central-1           # where the AssumeRole call itself is made

# --- The accounts ------------------------------------------------------------
# `name` is the node's path segment: keep it stable, because every maintenance pin
# under this check hangs off it. `role_arn` may be omitted for an account reachable
# with the ambient credentials directly. `regions` and `profile` each **replace**
# the default rather than adding to it. `title` / `about` are this installation's
# own words for the account, and label its node — so a check that names ONE account,
# which has no such node, says them in its own `title:` / `about:` above. Written on
# that one account they are read and not shown, and the log says so once at load.
accounts:
  - name: live
    role_arn: arn:aws:iam::000000000000:role/application/monitoring-role
    about: |
      Everything customer-facing runs here.

  - name: backup
    role_arn: arn:aws:iam::000000000001:role/application/monitoring-role
    regions: [eu-west-1]           # replaces the default, does not add to it
    title: Backup (Ireland)

# --- The aspects -------------------------------------------------------------
# Each block opens with `enabled:`. Off, the aspect emits no node **and makes no
# API call** — which is what a role whose policy does not carry that service needs.
# An aspect that says nothing is on; switching *all* of them off is refused at
# startup; and the check's card names what is off, because an absent node otherwise
# reads exactly like a broken check.

cloudwatch:
  enabled: true

  # Alarm-name **substrings**, case-insensitive — not a regex. An ignored alarm is
  # out of scope: it leaves the lines and the count.
  ignore_name_patterns: [targettracking, autoscaling-lifecycle]

  # An alarm whose name starts with this is tagged on its line, with the prefix
  # itself as the word — `tag_prefix: "sre-"` tags a matching alarm `(sre)`. Empty
  # by default: an alarm naming convention belongs to the estate being watched,
  # not to the check type.
  tag_prefix: ""

  # Composite alarms are read as well and tagged. `describe_alarms` returns only
  # metric alarms unless asked, which is an easy blind spot to inherit.
  include_composite: true

  # Healthy alarms are not listed — an OK line per alarm is a hundred lines saying
  # nothing. The first line still says how many were seen.
  show_healthy: false

  # Warn when an account sees fewer alarms than this. Cannot be 0: a check that
  # expects nothing cannot notice that it saw nothing.
  expect_min_alarms: 1

  # StateValue -> the code that line reports. INSUFFICIENT_DATA warns rather than
  # passing: an alarm with no data is usually an alarm whose metric stopped
  # arriving, and OK made that invisible.
  state_map:
    ALARM: ERROR
    INSUFFICIENT_DATA: WARN
    OK: OK

ec2:
  enabled: true

  # Not an instance any more. A terminated one lingers in the API for about an
  # hour, and counting it would report a duplicate that no longer exists. A
  # **stopped** one is deliberately still counted — it is the leftover being looked
  # for. Add `stopped` here to disagree.
  ignore_states: [terminated, shutting-down]

  # Every threshold below is a **pair** — a warning level and an error level — and
  # a level that is not written here is not graded at all. This check ships no
  # thresholds of its own: what a name may carry and how long a box may run are
  # facts about an estate, not about the type, so an `ec2:` block that sets none of
  # them lists instances and colors nothing (and says so once, in the log).
  #
  # The comparison is *more than*, so `max_per_name_warn: 1` warns at two — and
  # `0` is how you ask to hear about any instance under a name at all.

  # How many instances may share a `Name` tag.
  max_per_name_warn: 1
  max_per_name_error: 8
  # What the line says when one of those levels fires. A number decides the color;
  # this decides whether a reader knows what to do about it.
  max_per_name_reason: "A second box under this name is usually a deploy that did not clean up."

  # How long the oldest instance under a name may have been up. A security reading,
  # not a tidiness one: an instance is patched by being replaced, so this applies to
  # a single tidy instance too.
  max_age_warn: 31d
  max_age_error: 40d
  max_age_reason: "The instance is too old to have the latest patch levels."

  # The levels above are the **net**: what this check says about a name that
  # matches no rule below. Rules give a set of names its own limits.
  #
  # They are consulted in order and the **first** one that matches decides, whole:
  # an exception is a rule written above the rule it excepts, and there is no
  # negation key. A judgment a rule does not mention is inherited from the net,
  # whole — write either level of a pair and the rule owns that pair.
  #
  # The limits apply to **each** matching name on its own, never to their sum: two
  # load tests carrying 10 and 12 boxes are two lines against the levels below,
  # not 22 against them.
  rules:
    # Scratch boxes: neither graded nor listed, and not counted in scope. First,
    # so nothing below sees them.
    - name: scratch
      prefixes: [tmp-, scratch-]
      ignore: true

    # A fleet is a *name*, now that there is a matcher: many is fine, many for
    # hours is a load test nobody tore down.
    - name: load tests
      prefixes: [loadtest-]
      regexes: ['^perf-[0-9]{8}$']
      max_per_name_warn: 15
      max_age_warn: 2h
      max_age_error: 4h
      max_age_reason: "A load test nobody tore down is the expensive kind of leftover."

    # The same count of two, a different finding — which is the whole point of
    # writing a sentence beside a number.
    - name: grafana
      prefixes: [grafana-]
      max_per_name_warn: 1
      max_per_name_error: 2
      max_per_name_reason: "A second one can come from an autostart; two is the most this may ever be."
      # the age pair is inherited from the net above

    - name: the single-volume boxes
      names: [licence-server, build-cache]
      max_per_name_error: 1
      max_per_name_reason: "This name owns a single block device — a second instance cannot have attached it."
      # Kept deliberately old: there is no infinity to compare against, only a
      # comparison that does not happen. The line still shows the age; it is
      # simply never colored by it.
      max_age: null

    # The instances nobody named, addressed as what they are rather than by the
    # placeholder text the card prints for them.
    - name: unnamed instances
      unnamed: true
      max_per_name_error: 1
      max_per_name_reason: "An instance with no Name tag belongs to nobody."

    # No sentence written yet, so a line this rule colors says `the build agents`
    # — the rule's name, which at least says where the decision was made.
    - name: the build agents
      prefixes: [jenkins-agent]
      max_per_name_error: 6

lambda:
  enabled: true

  # Every function has a node of its own beneath `lambda`, named by what AWS calls
  # it; its line stands there. With `series_keep` set above, every minute a function
  # was invoked in is kept as one run of it — invocations, errors, duration_ms — and
  # drawn on the function's node. CloudWatch bills by the metric asked: `Errors` of
  # every function on every poll, as always, and `Invocations` and `Duration` only
  # of a function that has a run to read. Nothing here configures any of it.

  # An error older than this is reported but not graded: by then CloudWatch has
  # condensed it into a bucket with the successful runs around it, so the count no
  # longer means "the last run failed". A **gate**, not a threshold with levels —
  # it decides whether the newest error is graded at all — and it keeps a default
  # where the other aspects' clocks have none, because where the window ends is a
  # fact about CloudWatch rather than about your estate.
  error_max_age: 14d

  # Read the newest log event per function and take its status word (REPORT, END,
  # ERROR, …). Two API calls per function per run — the expensive half of this
  # aspect. Set false to grade on the metric alone.
  read_log_status: true

  # Whether a function nobody has invoked in the retention window is a finding.
  # True for a scheduled job; a rule turns it off for handlers that run when
  # somebody calls them.
  expect_invocations: true

  # What a line says when it is graded. `error_reason` when the function is red
  # for errors, `silent_reason` when it warns for never being invoked.
  error_reason: "Check the dead-letter queue before retrying."
  silent_reason: "This runs on a schedule; silence means it did not run."

  # A set of functions with its own answers. Same shape as the rules above:
  # checked in order, first match decides, a key not named here is inherited, and
  # `ignore: true` drops those functions entirely — which is what this aspect's
  # old `ignore:` list of whole names did.
  rules:
    - name: retired handlers
      prefixes: [old-]
      ignore: true

    - name: on-demand handlers
      prefixes: [api-]
      expect_invocations: false    # called by somebody, not by a schedule

    - name: the nightly batch
      prefixes: [batch-]
      error_max_age: 30d           # it runs rarely; grade an error for longer
      read_log_status: false       # and do not pay two API calls for it

codepipeline:
  enabled: true

  # Every pipeline has a node of its own beneath `codepipeline`, named by what AWS
  # calls it; its line stands there and says what its newest execution did. With
  # `series_keep` set above, a poll also reads, out of the one page of executions it
  # asks for anyway, every execution the pipeline's history lacks or holds
  # unfinished, and the pipeline's node draws them. Nothing here configures that.

  # How long a *successful* run stays evidence that the pipeline still works, as a
  # pair of levels with no defaults — how long a success lasts depends on how often
  # the pipeline is meant to run, which is a fact about your estate. It only ever
  # downgrades an OK: a month-old failure is already the finding.
  max_age_warn: 31d
  max_age_error: 90d
  max_age_reason: "Nobody has released through this pipeline in months."

  # A set of pipelines with its own clock. Same shape as the `ec2` rules above:
  # checked in order, first match decides, a level not named here is inherited
  # from the levels above, and `ignore: true` drops those pipelines entirely
  # (which is what this aspect's old `ignore_name_patterns` did).
  rules:
    - name: sandboxes
      prefixes: [sandbox-]
      ignore: true

    - name: nightly builds
      prefixes: [nightly-]
      max_age_warn: 36h            # it runs every night; a day and a half is late

    - name: release pipelines
      prefixes: [release-]
      max_age: null                # runs when we release, so never stale

  # PipelineExecutionStatus -> the code that line reports, matched case-insensitively.
  # A pipeline that has never been executed warns rather than being left out. A kept
  # execution that is no longer the newest is marked by this map too — except one a
  # newer execution overtook: `Superseded` is an error on the line of a pipeline
  # whose newest execution it is, and behind the newest it is marked as neither.
  state_map:
    Succeeded: OK
    InProgress: WARN
    Failed: ERROR
    Stopped: ERROR
    Stopping: ERROR
    Cancelled: ERROR
    Superseded: ERROR

batch:
  enabled: true

  # Every job queue has a node of its own beneath `batch`, and every job name one
  # beneath its queue's, each named by what AWS calls it. A job name's line stands on
  # its node; a queue's node speaks only where the queue has something to say. With
  # `series_keep` set above, every run is kept and drawn on its job name's node.

  # A job name that contains one of these has no node, and none of its runs is kept.
  ignore_name_patterns: []
  # A queue whose name contains one of these is not read at all.
  ignore_queue_patterns: []

  # Whether a queue holding no jobs at all warns.
  expect_jobs: true

  # How long a job may RUN before its line warns. A running job is not a fault by
  # itself, and a permanent yellow is a light people stop reading. The oldest
  # running job decides, so a queue that keeps starting fresh ones cannot reset it.
  max_run_time: 2h

  # How long a job may sit RUNNABLE — accepted by the queue, waiting for capacity
  # that has not appeared — before its line warns. Measured from submission,
  # because such a job has never started.
  max_wait_time: 30m

  # How many jobs are read per queue per status, newest first. Reaching this bound
  # is said out loud on the queue's node rather than silently truncating, and a job
  # name whose runs are no longer among those read has no node until it runs again.
  max_jobs: 100

# --- Display-name substitutions ----------------------------------------------
# Applied in order to the names the `lambda`, `codepipeline` and `batch` aspects
# print — an organization's naming, so it lives here rather than in the type. An
# aspect that writes its own `shorten:` replaces this list outright; `shorten: []`
# inside an aspect opts that aspect out. The **slug keeps the full name**, so
# editing these cannot re-point a maintenance pin.
shorten:
  - {from: "-pipeline"}
  - {from: "-lambda"}
  - {from: "-reporter", to: "-rp"}

# --- Display text for the aspects (title / about) ----------------------------
# Built into the type, so it is not copied per account. Add a `subnodes:` block
# only to change one: your text replaces the built-in default, or extends it where
# you write {default} inside your own. little-sister itself reads this block, so
# an entry here applies to the node of that name under **every** account this
# check watches — the built-in text names no account for the same reason. The
# block names aspects: a function, a pipeline, a job queue, a job name, a region or
# an account that is called like one is not reached by it, and is labeled by its
# path, in `nodes.yaml`.
#
# subnodes:
#   batch:
#     about: |
#       {default}
#
#       Our nightly ETL runs here; a failure before 06:00 is worth a page.
#
# The same block carries `show_when_quiet`, and this type already declares it for
# `ec2`, `lambda`, `batch` and `codepipeline`: those four report a roster — every
# instance, function, queue or pipeline they found, whether or not anything is
# wrong — so a dense dashboard must not fold their lines away for being quiet
# (little-sister ADR-0063); the roster of `lambda`, `codepipeline` and `batch` is
# its nodes, each function, pipeline and job name a chip in a box that is not
# folded away. `cloudwatch` deliberately does not declare it: with
# `show_healthy: false` above it drops its quiet lines instead of showing them.
# You need write nothing for any of this. To decline one, say so:
#
# subnodes:
#   ec2:
#     show_when_quiet: false
